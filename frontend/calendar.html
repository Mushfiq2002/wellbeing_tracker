<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 24px;
      color: #333;
    }

    /* Calendar Header */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #fff;
      padding: 16px 20px;
      border-radius: 8px 8px 0 0;
      border: 1px solid #e0e0e0;
      border-bottom: none;
    }

    .calendar-header h2 {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .calendar-header button {
      background: none;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 14px;
      color: #333;
    }

    .calendar-header button:hover {
      background-color: #f0f0f0;
    }

    /* Calendar Grid */
    .calendar-grid {
      background-color: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 0 0 8px 8px;
    }

    .day-names {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid #e0e0e0;
    }

    .day-name {
      text-align: center;
      padding: 10px 0;
      font-size: 13px;
      font-weight: bold;
      color: #888;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day-cell {
      min-height: 80px;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      padding: 6px;
      cursor: pointer;
      position: relative;
    }

    .day-cell:nth-child(7n) {
      border-right: none;
    }

    .day-cell:hover {
      background-color: #f9f9f9;
    }

    .day-cell.empty {
      background-color: #fafafa;
      cursor: default;
    }

    .day-cell.today .day-number {
      background-color: #4a90e2;
      color: #fff;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .day-number {
      font-size: 13px;
      font-weight: bold;
      color: #333;
      margin-bottom: 4px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .event-dot {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-dot.todo {
      background-color: #e3f0ff;
      color: #1a6abf;
    }

    .event-dot.mood {
      background-color: #fff3e0;
      color: #b45309;
    }

    .event-dot.sleep {
      background-color: #e8f5e9;
      color: #2e7d32;
    }

    .event-dot.note {
      background-color: #f3e5f5;
      color: #6a1b9a;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .modal h3 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #333;
    }

    .modal label {
      font-size: 13px;
      color: #666;
      display: block;
      margin-bottom: 4px;
    }

    .modal select,
    .modal input[type="text"],
    .modal textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-bottom: 12px;
      outline: none;
    }

    .modal select:focus,
    .modal input:focus,
    .modal textarea:focus {
      border-color: #4a90e2;
    }

    .modal textarea {
      resize: vertical;
      min-height: 70px;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .modal-buttons button {
      padding: 8px 18px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #fff;
    }

    .modal-buttons .btn-save {
      background-color: #4a90e2;
      color: #fff;
      border-color: #4a90e2;
    }

    .modal-buttons .btn-save:hover {
      background-color: #357abd;
    }

    /* Events Panel */
    .events-panel {
      margin-top: 24px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
    }

    .events-panel h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #333;
    }

    .event-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 5px;
      margin-bottom: 8px;
    }

    .event-item .event-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .event-type-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .event-item button {
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 13px;
      cursor: pointer;
    }

    .no-events {
      font-size: 14px;
      color: #aaa;
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #555;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Calendar</h1>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#e3f0ff;border:1px solid #4a90e2;"></div> Todo</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fff3e0;border:1px solid #f59e0b;"></div> Mood</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e8f5e9;border:1px solid #27ae60;"></div> Sleep</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f3e5f5;border:1px solid #9b59b6;"></div> Note</div>
  </div>

  <!-- Calendar Header -->
  <div class="calendar-header">
    <button onclick="prevMonth()">&#8592; Prev</button>
    <h2 id="monthYear"></h2>
    <button onclick="nextMonth()">Next &#8594;</button>
  </div>

  <!-- Calendar Grid -->
  <div class="calendar-grid">
    <div class="day-names">
      <div class="day-name">Sun</div>
      <div class="day-name">Mon</div>
      <div class="day-name">Tue</div>
      <div class="day-name">Wed</div>
      <div class="day-name">Thu</div>
      <div class="day-name">Fri</div>
      <div class="day-name">Sat</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <!-- Events Panel -->
  <div class="events-panel">
    <h3 id="eventsPanelTitle">All Events</h3>
    <div id="eventsList"></div>
  </div>
</div>

<!-- Add Event Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Add Event</h3>
    <label>Type</label>
    <select id="eventType">
      <option value="todo">Todo</option>
      <option value="mood">Mood</option>
      <option value="sleep">Sleep</option>
      <option value="note">Note</option>
    </select>
    <label>Description</label>
    <textarea id="eventDesc" placeholder="Enter details..."></textarea>
    <div class="modal-buttons">
      <button onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEvent()">Save</button>
    </div>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:5000/api/calendar';

  function getToken() {
    const user = JSON.parse(localStorage.getItem('user'));
    return user ? user.token : null;
  }

  function getHeaders() {
    return {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + getToken()
    };
  }

  let currentDate = new Date();
  let selectedDate = null;
  let allEvents = [];

  const monthNames = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];

  async function loadEvents() {
    try {
      const res = await fetch(API_URL, { headers: getHeaders() });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      allEvents = data;
      renderCalendar();
      renderEventsList(null);
    } catch (err) {
      console.error(err.message);
      renderCalendar();
    }
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthYear').textContent = monthNames[month] + ' ' + year;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();

    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';

      const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
      if (isToday) cell.classList.add('today');

      const dateStr = year + '-' + String(month + 1).padStart(2,'0') + '-' + String(d).padStart(2,'0');

      const numDiv = document.createElement('div');
      numDiv.className = 'day-number';
      numDiv.textContent = d;
      cell.appendChild(numDiv);

      const dayEvents = allEvents.filter(e => e.date === dateStr);
      dayEvents.slice(0, 2).forEach(ev => {
        const dot = document.createElement('div');
        dot.className = 'event-dot ' + ev.type;
        dot.textContent = ev.description;
        cell.appendChild(dot);
      });
      if (dayEvents.length > 2) {
        const more = document.createElement('div');
        more.className = 'event-dot note';
        more.textContent = '+' + (dayEvents.length - 2) + ' more';
        cell.appendChild(more);
      }

      cell.addEventListener('click', () => openModal(dateStr));
      grid.appendChild(cell);
    }
  }

  function openModal(dateStr) {
    selectedDate = dateStr;
    document.getElementById('modalTitle').textContent = 'Add Event — ' + dateStr;
    document.getElementById('eventDesc').value = '';
    document.getElementById('eventType').value = 'todo';
    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  async function saveEvent() {
    const type = document.getElementById('eventType').value;
    const description = document.getElementById('eventDesc').value.trim();
    if (!description) return;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({ date: selectedDate, type, description })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      closeModal();
      loadEvents();
    } catch (err) {
      console.error(err.message);
    }
  }

  async function deleteEvent(id) {
    try {
      await fetch(API_URL + '/' + id, {
        method: 'DELETE',
        headers: getHeaders()
      });
      loadEvents();
    } catch (err) {
      console.error(err.message);
    }
  }

  function renderEventsList(dateFilter) {
    const list = document.getElementById('eventsList');
    const title = document.getElementById('eventsPanelTitle');
    list.innerHTML = '';

    const filtered = dateFilter ? allEvents.filter(e => e.date === dateFilter) : allEvents;
    title.textContent = dateFilter ? 'Events on ' + dateFilter : 'All Events';

    if (filtered.length === 0) {
      list.innerHTML = '<p class="no-events">No events found.</p>';
      return;
    }

    filtered.forEach(ev => {
      const item = document.createElement('div');
      item.className = 'event-item';
      item.innerHTML = `
        <div class="event-info">
          <span class="event-type-badge event-dot ${ev.type}">${ev.type}</span>
          <span style="font-size:14px;">${ev.date} — ${ev.description}</span>
        </div>
        <button onclick="deleteEvent('${ev._id}')">Delete</button>
      `;
      list.appendChild(item);
    });
  }

  function prevMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  }

  function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  }

  window.onclick = function(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  };

  loadEvents();
</script>

</body>
</html>
