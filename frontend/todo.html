<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }

    .input-row input:focus {
      border-color: #4a90e2;
    }

    .input-row button {
      padding: 10px 20px;
      font-size: 14px;
      background-color: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .input-row button:hover {
      background-color: #357abd;
    }

    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-box {
      flex: 1;
      background-color: #f4f6f8;
      border-radius: 5px;
      padding: 12px;
      text-align: center;
    }

    .stat-box p {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }

    .stat-box span {
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }

    .stat-box.done span {
      color: #27ae60;
    }

    .stat-box.remaining span {
      color: #e67e22;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 5px;
      background-color: #fff;
    }

    .todo-item .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .todo-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .todo-item span {
      font-size: 14px;
      color: #333;
    }

    .todo-item span.completed {
      text-decoration: line-through;
      color: #aaa;
    }

    .todo-item button {
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 13px;
      cursor: pointer;
    }

    .todo-item button:hover {
      text-decoration: underline;
    }

    .empty-msg {
      font-size: 14px;
      color: #aaa;
      text-align: center;
      padding: 20px 0;
      display: none;
    }

    .error-msg {
      font-size: 14px;
      color: #e74c3c;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>To-Do List</h1>

    <p class="error-msg" id="errorMsg"></p>

    <!-- Input Row -->
    <div class="input-row">
      <input type="text" id="todoInput" placeholder="Add a new task..." />
      <button onclick="addTodo()">Add</button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-box">
        <p>Total</p>
        <span id="totalCount">0</span>
      </div>
      <div class="stat-box done">
        <p>Done</p>
        <span id="doneCount">0</span>
      </div>
      <div class="stat-box remaining">
        <p>Remaining</p>
        <span id="remainCount">0</span>
      </div>
    </div>

    <!-- Todo List -->
    <ul class="todo-list" id="todoList"></ul>
    <p class="empty-msg" id="emptyMsg">No tasks yet. Add one above!</p>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/todos';

    function getToken() {
      const user = JSON.parse(localStorage.getItem('user'));
      return user ? user.token : null;
    }

    function getHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + getToken()
      };
    }

    // Load all todos
    async function loadTodos() {
      try {
        const res = await fetch(API_URL, {
          method: 'GET',
          headers: getHeaders()
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        renderTodos(data);
      } catch (err) {
        showError(err.message);
      }
    }

    // Add a todo
    async function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        input.value = '';
        loadTodos();
      } catch (err) {
        showError(err.message);
      }
    }

    // Toggle completed
    async function toggleTodo(id, completed) {
      try {
        const res = await fetch(API_URL + '/' + id, {
          method: 'PUT',
          headers: getHeaders(),
          body: JSON.stringify({ completed: !completed })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        loadTodos();
      } catch (err) {
        showError(err.message);
      }
    }

    // Delete a todo
    async function deleteTodo(id) {
      try {
        const res = await fetch(API_URL + '/' + id, {
          method: 'DELETE',
          headers: getHeaders()
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        loadTodos();
      } catch (err) {
        showError(err.message);
      }
    }

    // Render todos to the page
    function renderTodos(todos) {
      const list = document.getElementById('todoList');
      const emptyMsg = document.getElementById('emptyMsg');
      list.innerHTML = '';

      if (todos.length === 0) {
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
        todos.forEach(todo => {
          const li = document.createElement('li');
          li.className = 'todo-item';
          li.innerHTML = `
            <div class="left">
              <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo('${todo._id}', ${todo.completed})" />
              <span class="${todo.completed ? 'completed' : ''}">${todo.text}</span>
            </div>
            <button onclick="deleteTodo('${todo._id}')">Delete</button>
          `;
          list.appendChild(li);
        });
      }

      const done = todos.filter(t => t.completed).length;
      document.getElementById('totalCount').textContent = todos.length;
      document.getElementById('doneCount').textContent = done;
      document.getElementById('remainCount').textContent = todos.length - done;
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    // Press Enter to add
    document.getElementById('todoInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addTodo();
    });

    // Load todos on page open
    loadTodos();
  </script>

</body>
</html>
