<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Streak Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 0 16px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }

    .error-msg {
      font-size: 14px;
      color: #e74c3c;
      margin-bottom: 10px;
      display: none;
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-box {
      flex: 1;
      background-color: #fff;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      border: 1px solid #e0e0e0;
    }

    .stat-box p {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    .stat-box span {
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }

    .stat-box.mood span { color: #e67e22; }
    .stat-box.sleep span { color: #27ae60; }
    .stat-box.study span { color: #4a90e2; }

    /* Log Activity */
    .log-section {
      background-color: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .log-section h2 {
      font-size: 16px;
      margin-bottom: 14px;
      color: #333;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-row select {
      flex: 1;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }

    .input-row select:focus {
      border-color: #4a90e2;
    }

    .input-row button {
      padding: 10px 20px;
      font-size: 14px;
      background-color: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .input-row button:hover {
      background-color: #357abd;
    }

    /* Streak List */
    .streak-section {
      background-color: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
    }

    .streak-section h2 {
      font-size: 16px;
      margin-bottom: 14px;
      color: #333;
    }

    .streak-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 5px;
      margin-bottom: 8px;
    }

    .streak-item .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .activity-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: bold;
    }

    .activity-badge.mood {
      background-color: #fff3e0;
      color: #b45309;
    }

    .activity-badge.sleep {
      background-color: #e8f5e9;
      color: #2e7d32;
    }

    .activity-badge.study {
      background-color: #e3f0ff;
      color: #1a6abf;
    }

    .streak-info {
      font-size: 14px;
      color: #333;
    }

    .streak-info span {
      font-size: 12px;
      color: #888;
      display: block;
      margin-top: 2px;
    }

    .streak-count {
      font-size: 20px;
      font-weight: bold;
      color: #4a90e2;
    }

    .streak-count small {
      font-size: 11px;
      color: #888;
      font-weight: normal;
    }

    .no-streaks {
      font-size: 14px;
      color: #aaa;
      text-align: center;
      padding: 20px 0;
    }

    .success-msg {
      font-size: 14px;
      color: #27ae60;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Streak Tracker</h1>

  <p class="error-msg" id="errorMsg"></p>
  <p class="success-msg" id="successMsg"></p>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-box mood">
      <p>Mood Streak</p>
      <span id="moodStreak">0</span>
    </div>
    <div class="stat-box sleep">
      <p>Sleep Streak</p>
      <span id="sleepStreak">0</span>
    </div>
    <div class="stat-box study">
      <p>Study Streak</p>
      <span id="studyStreak">0</span>
    </div>
  </div>

  <!-- Log Activity -->
  <div class="log-section">
    <h2>Log Today's Activity</h2>
    <div class="input-row">
      <select id="activityType">
        <option value="mood">Mood Logging</option>
        <option value="sleep">Sleep Tracking</option>
        <option value="study">Study Session</option>
      </select>
      <button onclick="logActivity()">Log</button>
    </div>
  </div>

  <!-- Streak History -->
  <div class="streak-section">
    <h2>Streak History</h2>
    <div id="streakList"></div>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:5000/api/streaks';

  function getToken() {
    const user = JSON.parse(localStorage.getItem('user'));
    return user ? user.token : null;
  }

  function getHeaders() {
    return {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + getToken()
    };
  }

  async function loadStreaks() {
    try {
      const res = await fetch(API_URL, { headers: getHeaders() });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      renderStreaks(data);
      updateStats(data);
    } catch (err) {
      showError(err.message);
    }
  }

  async function logActivity() {
    const type = document.getElementById('activityType').value;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({ activityType: type })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      showSuccess('Activity logged successfully!');
      loadStreaks();
    } catch (err) {
      showError(err.message);
    }
  }

  function updateStats(streaks) {
    const mood = streaks.find(s => s.activityType === 'mood');
    const sleep = streaks.find(s => s.activityType === 'sleep');
    const study = streaks.find(s => s.activityType === 'study');

    document.getElementById('moodStreak').textContent = mood ? mood.currentStreak : 0;
    document.getElementById('sleepStreak').textContent = sleep ? sleep.currentStreak : 0;
    document.getElementById('studyStreak').textContent = study ? study.currentStreak : 0;
  }

  function renderStreaks(streaks) {
    const list = document.getElementById('streakList');
    list.innerHTML = '';

    if (streaks.length === 0) {
      list.innerHTML = '<p class="no-streaks">No activity logged yet. Log your first activity above!</p>';
      return;
    }

    streaks.forEach(streak => {
      const item = document.createElement('div');
      item.className = 'streak-item';

      const activityLabel = streak.activityType === 'mood' ? 'Mood Logging'
        : streak.activityType === 'sleep' ? 'Sleep Tracking' : 'Study Session';

      const lastLogged = new Date(streak.lastLoggedDate).toLocaleDateString();

      item.innerHTML = `
        <div class="left">
          <span class="activity-badge ${streak.activityType}">${activityLabel}</span>
          <div class="streak-info">
            Current Streak
            <span>Last logged: ${lastLogged}</span>
          </div>
        </div>
        <div class="streak-count">
          ${streak.currentStreak} <small>days</small>
        </div>
      `;
      list.appendChild(item);
    });
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  loadStreaks();
</script>

</body>
</html>
